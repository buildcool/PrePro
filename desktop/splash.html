<!doctype html>
<html><head><meta charset="utf-8"><title>PrePro</title>
<style>
  :root { --bg:#0f1012; --fg:#ececec; --mute:#9aa0a8; --acc:#f97316; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f6f4; --fg:#1b1b1b; --mute:#5f6368; --acc:#ea580c; color-scheme: light; } }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  body { display:grid; place-items:center; }
  .box { text-align:center; padding:16px; }
  .logo { width:56px; height:56px; border-radius:14px; background:var(--acc); color:#fff; display:grid; place-items:center; font-weight:800; font-size:28px; margin:0 auto 14px; }
  .bar { width:220px; height:4px; background:color-mix(in srgb, var(--mute) 25%, transparent); border-radius:2px; overflow:hidden; margin:16px auto 0; }
  .bar > div { width:40%; height:100%; background:var(--acc); animation: s 1.1s ease-in-out infinite; }
  @keyframes s { 0% { transform: translateX(-100%) } 100% { transform: translateX(250%) } }
  #msg { color:var(--mute); font-size:13px; margin-top:10px; max-width:520px; white-space:pre-wrap; }
</style></head>
<body><div class="box"><div class="logo">P</div><b>PrePro</b><div id="msg">Starting the local engine…</div><div class="bar"><div></div></div></div></body></html>
