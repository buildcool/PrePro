name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng melt
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e ".[asr,ai,geo,export,dev]"
      - name: Lint
        run: uv run --python .venv ruff check src tests
      - name: Tests
        run: uv run --python .venv pytest -m "not slow and not realmedia and not live" -x
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the review app (type-check + bundle)
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
