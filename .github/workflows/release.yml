name: release
# Tags can't be pushed from the authoring environment, so a release is cut whenever `main` carries a
# version (pyproject.toml) that has no tag yet: this job creates the tag, builds and publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.check.outputs.exists == 'false' }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - id: check
        run: |
          if git rev-parse "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.exists == 'false'
        uses: astral-sh/setup-uv@v5
      - if: steps.check.outputs.exists == 'false'
        run: uv build
      - if: steps.check.outputs.exists == 'false'
        run: |
          f="docs/releases/v${{ steps.v.outputs.version }}.md"
          [ -f "$f" ] || echo "PrePro v${{ steps.v.outputs.version }}" > "$f"
      - if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PrePro v${{ steps.v.outputs.version }}
          body_path: docs/releases/v${{ steps.v.outputs.version }}.md
          files: dist/*
  desktop:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      release_tag: v${{ needs.release.outputs.version }}
