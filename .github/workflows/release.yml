name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel + sdist
        run: uv build
      - name: Release notes
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$f" ] || echo "PrePro ${GITHUB_REF_NAME}" > "$f"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*
