name: desktop
# Builds the desktop app: frozen engine (PyInstaller) + bundled ffmpeg + Electron shell.
# Linux → AppImage + .deb, Windows → NSIS installer. Called by `release` for every new version, or run by hand.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: "Attach the installers to this GitHub release (empty = upload as build artifacts only)"
        type: string
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: --linux AppImage deb
          - os: windows-latest
            target: --win nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Freeze the engine
        shell: bash
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e ".[asr,ai,geo,export]" "pyinstaller>=6.10"
          uv run --python .venv python scripts/build_engine.py
      - name: Bundle ffmpeg (Linux, static build, checksum-verified)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          base=https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          curl -fsSLO "$base" && curl -fsSLO "$base.md5"
          md5sum -c ffmpeg-release-amd64-static.tar.xz.md5
          mkdir -p ff dist/prepro-engine/bin
          tar -xJf ffmpeg-release-amd64-static.tar.xz -C ff --strip-components=1
          cp ff/ffmpeg ff/ffprobe dist/prepro-engine/bin/
          cp ff/GPLv3.txt dist/prepro-engine/bin/FFMPEG-LICENSE.txt
          cp ff/readme.txt dist/prepro-engine/bin/FFMPEG-README.txt || true
      - name: Bundle ffmpeg (Windows, gyan.dev essentials, checksum-verified)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $u = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest $u -OutFile ff.zip
          $want = (Invoke-WebRequest "$u.sha256").Content.Trim().Split(" ")[0].ToUpper()
          $got = (Get-FileHash ff.zip -Algorithm SHA256).Hash.ToUpper()
          if ($want -ne $got) { throw "ffmpeg checksum mismatch: $got vs $want" }
          Expand-Archive ff.zip -DestinationPath ff
          New-Item -ItemType Directory -Force dist/prepro-engine/bin | Out-Null
          $d = Get-ChildItem ff -Directory | Select-Object -First 1
          Copy-Item "$($d.FullName)/bin/ffmpeg.exe", "$($d.FullName)/bin/ffprobe.exe" dist/prepro-engine/bin/
          Copy-Item "$($d.FullName)/LICENSE" dist/prepro-engine/bin/FFMPEG-LICENSE.txt
      - name: Smoke-test the frozen engine
        shell: bash
        run: |
          ./dist/prepro-engine/prepro-engine version
          ./dist/prepro-engine/prepro-engine doctor
      - name: Package
        shell: bash
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: prepro-desktop-${{ runner.os }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
          if-no-files-found: error
      - if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
