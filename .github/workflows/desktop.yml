name: desktop
# Builds the desktop app: frozen engine (PyInstaller) + bundled ffmpeg + Electron shell.
# Linux → AppImage + .deb, Windows → NSIS installer. Called by `release` for every new version, or run by hand.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: "Attach the installers to this GitHub release (empty = upload as build artifacts only)"
        type: string
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: --linux AppImage deb
          - os: windows-latest
            target: --win nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Freeze the engine
        shell: bash
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e ".[asr,ai,geo,export]" "pyinstaller>=6.10"
          uv run --python .venv python scripts/build_engine.py
      - name: Bundle ffmpeg (Linux, static build, checksum-verified)
        if: runner.os == 'Linux'
        shell: bash
        # v0.6.0 shipped without Linux installers because this one download failed once. Retry it, and fall back to
        # BtbN's static GPL build on GitHub (checked against its published sha256) when johnvansickle.com is down.
        run: |
          set -euo pipefail
          mkdir -p ff dist/prepro-engine/bin
          get() { curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors --connect-timeout 30 -o "$2" "$1"; }
          jvs() {
            local base=https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            get "$base" ff.tar.xz || return 1
            get "$base.md5" ff.tar.xz.md5 || return 1
            [ "$(cut -d' ' -f1 ff.tar.xz.md5)" = "$(md5sum ff.tar.xz | cut -d' ' -f1)" ] || { echo "md5 mismatch"; return 1; }
            tar -xJf ff.tar.xz -C ff --strip-components=1 || return 1
            cp ff/GPLv3.txt dist/prepro-engine/bin/FFMPEG-LICENSE.txt || return 1
            cp ff/readme.txt dist/prepro-engine/bin/FFMPEG-README.txt || true
          }
          btbn() {
            local rel=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
            local name
            name=$(curl -fsSL --retry 5 -H "Authorization: Bearer ${{ github.token }}" \
                     https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest \
                   | jq -r '.assets[].name' | grep -E '^ffmpeg-n[0-9.]+-latest-linux64-gpl-[0-9.]+\.tar\.xz$' | sort -V | tail -1)
            [ -n "$name" ] || { echo "no BtbN linux64 release build listed"; return 1; }
            get "$rel/$name" ff.tar.xz || return 1
            get "$rel/checksums.sha256" checksums.sha256 || return 1
            [ "$(grep " $name\$" checksums.sha256 | cut -d' ' -f1)" = "$(sha256sum ff.tar.xz | cut -d' ' -f1)" ] || { echo "sha256 mismatch"; return 1; }
            tar -xJf ff.tar.xz -C ff --strip-components=1 || return 1
            mv ff/bin/ffmpeg ff/bin/ffprobe ff/ || return 1
            cp ff/LICENSE.txt dist/prepro-engine/bin/FFMPEG-LICENSE.txt || return 1
            echo "FFmpeg static build $name from github.com/BtbN/FFmpeg-Builds" > dist/prepro-engine/bin/FFMPEG-README.txt
          }
          jvs || { echo "::warning::johnvansickle.com failed; using BtbN's build"; rm -rf ff ff.tar.xz*; mkdir -p ff; btbn; }
          cp ff/ffmpeg ff/ffprobe dist/prepro-engine/bin/
          dist/prepro-engine/bin/ffmpeg -hide_banner -version | head -1
      - name: Bundle ffmpeg (Windows, checksum-verified)
        if: runner.os == 'Windows'
        shell: pwsh
        # v0.12.2 shipped without its Windows installer because gyan.dev's checksum file answered 503 for a while. Retry
        # it, and fall back to BtbN's static GPL build on GitHub (checked against its published sha256), as on Linux.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force ff, dist/prepro-engine/bin | Out-Null
          function AsText($r) { if ($r.Content -is [byte[]]) { [System.Text.Encoding]::ASCII.GetString($r.Content) } else { [string]$r.Content } }
          function Fetch($url, $out) { Invoke-WebRequest $url -OutFile $out -MaximumRetryCount 5 -RetryIntervalSec 15 -ConnectionTimeoutSeconds 60 }
          function Gyan {
            $u = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
            Fetch $u ff.zip
            $want = (AsText (Invoke-WebRequest "$u.sha256" -MaximumRetryCount 5 -RetryIntervalSec 15)).Trim().Split(" ")[0].ToUpper()
            $got = (Get-FileHash ff.zip -Algorithm SHA256).Hash.ToUpper()
            if ($want -ne $got) { throw "gyan.dev checksum mismatch: $got vs $want" }
            Expand-Archive ff.zip -DestinationPath ff
            $d = Get-ChildItem ff -Directory | Select-Object -First 1
            Copy-Item "$($d.FullName)/bin/ffmpeg.exe", "$($d.FullName)/bin/ffprobe.exe" dist/prepro-engine/bin/
            Copy-Item "$($d.FullName)/LICENSE" dist/prepro-engine/bin/FFMPEG-LICENSE.txt
          }
          function Btbn {
            $api = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest" `
                     -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -MaximumRetryCount 5 -RetryIntervalSec 15
            $name = $api.assets.name | Where-Object { $_ -match '^ffmpeg-n[0-9.]+-latest-win64-gpl-[0-9.]+\.zip$' } |
                    Sort-Object { [version]($_ -replace '^ffmpeg-n([0-9.]+)-.*$', '$1') } | Select-Object -Last 1
            if (-not $name) { throw "no BtbN win64 release build listed" }
            $rel = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
            Fetch "$rel/$name" ff.zip
            $sums = AsText (Invoke-WebRequest "$rel/checksums.sha256" -MaximumRetryCount 5 -RetryIntervalSec 15)
            $line = ($sums -split "\r?\n") | Where-Object { $_.Trim().EndsWith(" $name") } | Select-Object -First 1
            if (-not $line) { throw "$name is not in BtbN's checksums" }
            $want = ($line.Trim() -split '\s+')[0].ToUpper()
            $got = (Get-FileHash ff.zip -Algorithm SHA256).Hash.ToUpper()
            if ($want -ne $got) { throw "BtbN checksum mismatch: $got vs $want" }
            Expand-Archive ff.zip -DestinationPath ff
            $d = Get-ChildItem ff -Directory | Select-Object -First 1
            Copy-Item "$($d.FullName)/bin/ffmpeg.exe", "$($d.FullName)/bin/ffprobe.exe" dist/prepro-engine/bin/
            Copy-Item "$($d.FullName)/LICENSE.txt" dist/prepro-engine/bin/FFMPEG-LICENSE.txt
            "FFmpeg static build $name from github.com/BtbN/FFmpeg-Builds" | Set-Content dist/prepro-engine/bin/FFMPEG-README.txt
          }
          try { Gyan } catch {
            Write-Host "::warning::gyan.dev failed ($($_.Exception.Message)); using BtbN's build"
            Remove-Item ff, ff.zip -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force ff | Out-Null
            Btbn
          }
          & dist/prepro-engine/bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1
      - name: Smoke-test the frozen engine
        shell: bash
        run: |
          ./dist/prepro-engine/prepro-engine version
          ./dist/prepro-engine/prepro-engine doctor
      - name: Start the frozen engine the way the app does (piped output, the system code page)
        # v0.8.0 shipped an engine that died on its first line in a cp1252 pipe; this starts `ui` exactly like the
        # desktop app and fails the build unless the server answers
        shell: bash
        run: |
          PYTHONUTF8=0 PYTHONIOENCODING= ./dist/prepro-engine/prepro-engine ui --no-browser --port 8799 > engine.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://127.0.0.1:8799/; then echo "engine up after ${i}s"; kill %1 || true; exit 0; fi
            if ! kill -0 %1 2>/dev/null; then echo "engine exited:"; cat engine.log; exit 1; fi
            sleep 1
          done
          echo "engine never answered:"; cat engine.log; exit 1
      - name: Package
        shell: bash
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder ${{ matrix.target }} --publish never
          # the files the app's updater reads (latest.yml on Windows, latest-linux.yml for the AppImage)
          ls release/latest*.yml; ls release/*.blockmap 2>/dev/null || true   # an AppImage carries its blockmap inside
          grep -q "version: $(node -p "require('./package.json').version")" release/latest*.yml
      - uses: actions/upload-artifact@v4
        with:
          name: prepro-desktop-${{ runner.os }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
            desktop/release/latest*.yml
            desktop/release/*.blockmap
          if-no-files-found: error
      - if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
            desktop/release/latest*.yml
            desktop/release/*.blockmap
